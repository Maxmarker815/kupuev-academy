<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Платформа KUPUEV ACADEMY</title>
<link rel="icon" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2EBD9; --paper-2:#EBE3CE; --paper-3:#E3DAC0;
  --ink:#1A1814; --ink-2:#4A453A; --ink-3:#8A8270; --ink-4:#B5AC97;
  --rule:#D4CCB5; --rule-strong:#B5AC97;
  --signal:#C73E1D; --signal-dark:#8A2A11; --signal-tint:#F8D7C9;
  --teal:#1B5E6B; --teal-dark:#0E3F49; --teal-tint:#C5DDE0;
  --highlight:#FFE89E; --warn:#B8860B;
  --green:#2F6B3D; --green-dark:#22522D; --green-tint:#CFE3D2;
  --serif:'Instrument Serif','Times New Roman',serif;
  --sans:'Space Grotesk',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{margin:0;font-weight:400}
p{margin:0 0 .6em}
button{font-family:inherit;font-size:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:inherit}
a{color:var(--teal-dark)}

/* ---------- shell ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 80px}
.topbar{border-bottom:2px solid var(--ink);background:var(--paper);position:sticky;top:0;z-index:50}
.topbar-in{max-width:1180px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:26px;line-height:1;letter-spacing:.03em}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);margin-top:4px}
.spacer{flex:1}
.who{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2);text-align:right}
.who b{display:block;font-family:var(--sans);font-size:13.5px;letter-spacing:0;text-transform:none;color:var(--ink)}

.btn{border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);padding:8px 16px;border-radius:2px;font-weight:500;transition:.12s}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn.primary{background:var(--signal);border-color:var(--signal);color:#fff}
.btn.primary:hover{background:var(--signal-dark);border-color:var(--signal-dark)}
.btn.ghost{border-color:var(--rule-strong);color:var(--ink-2)}
.btn.sm{padding:5px 11px;font-size:13.5px}
.btn.tiny{padding:3px 8px;font-size:12px}

.demo-flag{background:var(--highlight);border-bottom:1px solid var(--rule-strong);font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:7px 20px;text-align:center;color:var(--ink-2)}
.reset-demo{font:inherit;letter-spacing:inherit;background:none;border:0;border-bottom:1px solid var(--ink-3);padding:0;color:var(--ink-2)}
.reset-demo:hover{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- login ---------- */
.login{max-width:520px;margin:6vh auto;padding:0 20px}
.login h1{font-family:var(--serif);font-size:46px;line-height:1.05;margin-bottom:10px}
.login .lede{color:var(--ink-2);margin-bottom:32px}
.roles{display:grid;gap:12px}
.role{display:flex;gap:16px;align-items:flex-start;text-align:left;width:100%;border:1.5px solid var(--rule-strong);background:var(--paper-2);padding:18px 20px;border-radius:3px;transition:.14s}
.role:hover{border-color:var(--ink);background:var(--paper-3)}
.role .ic{width:38px;height:38px;flex:none;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:19px}
.role b{display:block;font-size:17px;font-weight:600;margin-bottom:2px}
.role span{color:var(--ink-3);font-size:13.5px;line-height:1.4}
.panel{border:1.5px solid var(--ink);background:var(--paper-2);padding:26px;border-radius:3px}
.field{margin-bottom:16px}
.field label{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;border:1.5px solid var(--rule-strong);background:var(--paper);padding:10px 12px;border-radius:2px;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--teal)}
.err{color:var(--signal);font-size:13.5px;min-height:20px}
.name-list{display:grid;gap:8px;max-height:340px;overflow:auto;margin-bottom:16px}
.name-list button{text-align:left;border:1.5px solid var(--rule-strong);background:var(--paper);padding:11px 14px;border-radius:2px}
.name-list button:hover{border-color:var(--signal);background:var(--signal-tint)}

/* ---------- generic blocks ---------- */
.section-head{display:flex;align-items:baseline;gap:14px;margin:34px 0 16px;padding-bottom:9px;border-bottom:2px solid var(--ink)}
.section-head h2{font-family:var(--serif);font-size:31px;line-height:1}
.section-head .sub{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
.card{border:1.5px solid var(--rule-strong);background:var(--paper-2);border-radius:3px;padding:18px}
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:8px}
.stat{border:1.5px solid var(--rule-strong);background:var(--paper-2);border-radius:3px;padding:14px 16px}
.stat .l{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.stat .v{font-family:var(--serif);font-size:37px;line-height:1}
.stat .v small{font-family:var(--sans);font-size:13.5px;color:var(--ink-3)}

.bar{height:9px;background:var(--paper-3);border:1px solid var(--rule-strong);border-radius:20px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:20px}

/* ---------- student ---------- */
.hero{border:2px solid var(--ink);background:var(--paper-2);border-radius:3px;padding:24px;margin-top:24px;display:flex;gap:26px;flex-wrap:wrap;align-items:center}
.hero .big{font-family:var(--serif);font-size:56px;line-height:.95}
.hero .big small{font-family:var(--sans);font-size:17px;color:var(--ink-3);letter-spacing:0}
.hero .grow{flex:1;min-width:240px}
/* Текущий проект — сразу с действиями, чтобы не искать его карточку среди семнадцати. */
.hero-acts{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}
.hero-acts .btn{text-decoration:none}
.hero-acts .mark{width:auto;padding:8px 16px}
.proj-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:12px;align-items:start}
.pcard{border:1.5px solid var(--rule-strong);background:var(--paper-2);border-radius:3px;padding:15px 16px;display:flex;flex-direction:column;gap:9px}
.pcard.done{border-color:var(--green);background:var(--green-tint)}
.pcard.stuck{border-color:var(--signal);background:var(--signal-tint)}
.pcard.doing{border-color:var(--warn);background:#F6EAC6}
.pcard .num{font-family:var(--mono);font-size:10px;letter-spacing:.16em;color:var(--ink-3)}
.pcard h3{font-family:var(--serif);font-size:22px;line-height:1.1}
.pcard .meta{font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.pcard .note{font-size:13.5px;background:var(--paper);border-left:3px solid var(--signal);padding:7px 10px;color:var(--ink-2)}

/* Одна кнопка на карточку: показывает состояние и переключает его.
   Пустой квадратик = ещё не собрано, зелёная с галочкой = собрано. */
.mark{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:9px 12px;border-radius:3px;
  border:1.5px solid var(--rule-strong);background:var(--paper);color:var(--ink-2);font-weight:500;transition:.12s}
.mark .box{width:18px;height:18px;flex:none;border:1.5px solid var(--rule-strong);border-radius:3px;background:var(--paper);
  display:grid;place-items:center;font-size:12px;line-height:1}
.mark:hover{border-color:var(--green);color:var(--ink)}
.mark:hover .box{border-color:var(--green)}
.mark.on{border-color:var(--green);background:var(--green);color:#fff;font-weight:600}
.mark.on .box{background:#fff;border-color:#fff;color:var(--green);font-weight:700}
.mark.on:hover{background:var(--green-dark);border-color:var(--green-dark);color:#fff}
/* Неактивная кнопка: проект ещё не в очереди, либо отметку с него уже не снять. */
.mark[disabled]{opacity:.42;cursor:default}
.mark[disabled]:hover{border-color:var(--rule-strong);color:var(--ink-2)}
.mark[disabled]:hover .box{border-color:var(--rule-strong)}
.mark.on[disabled]{opacity:.6}
.mark.on[disabled]:hover{background:var(--green);border-color:var(--green);color:#fff}

.pcard .acts{display:flex;gap:6px;flex-wrap:wrap}
.pcard .acts .btn{text-decoration:none;background:var(--paper)}
/* Статус — единственное цветное пятно на карточке. Залитая плашка = состояние. */
.chip{display:inline-block;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:20px;border:1.5px solid}
.chip.todo{border-color:var(--ink-4);color:var(--ink-3);background:transparent;font-weight:400}
.chip.doing{border-color:var(--warn);color:#fff;background:var(--warn)}
.chip.stuck{border-color:var(--signal);color:#fff;background:var(--signal)}
.chip.done{border-color:var(--green);color:#fff;background:var(--green)}

/* ---------- teacher matrix ---------- */
.scrollx{overflow-x:auto;border:1.5px solid var(--rule-strong);border-radius:3px;background:var(--paper-2)}
table.mx{border-collapse:collapse;font-size:13.5px;min-width:100%}
table.mx th,table.mx td{border:1px solid var(--rule);padding:0}
table.mx thead th{background:var(--paper-3);font-family:var(--mono);font-size:10px;font-weight:500;letter-spacing:.06em;padding:8px 4px;white-space:nowrap}
table.mx tbody th{background:var(--paper-2);text-align:left;font-weight:500;padding:7px 12px;white-space:nowrap;position:sticky;left:0;z-index:2;border-right:2px solid var(--rule-strong)}
table.mx td.cell{width:30px;height:30px;text-align:center;cursor:default}
.cell i{display:block;width:100%;height:100%;font-style:normal;line-height:30px;font-size:12px}
.cell .s-todo{background:var(--paper)}
.cell .s-doing{background:#F0D98A}
.cell .s-stuck{background:var(--signal);color:#fff;font-weight:700}
.cell .s-done{background:var(--green);color:#fff}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:10px;color:var(--ink-2);margin:10px 0 0}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;display:block;border:1px solid var(--rule-strong)}

/* Ссылка, оформленная как кнопка (открывает инструкцию в новой вкладке). */
a.btn{text-decoration:none;display:inline-block;text-align:center;background:var(--paper)}
/* Номер проекта в шапке матрицы — это ссылка на нужный раздел инструкции. */
table.mx thead th a.mxh{display:block;color:var(--ink-2);text-decoration:none;padding:1px 3px;border-radius:2px}
table.mx thead th a.mxh:hover{background:var(--ink);color:var(--paper)}
.stuck-item{display:flex;gap:14px;align-items:flex-start;border-bottom:1px solid var(--rule);padding:13px 0}
.stuck-item:last-child{border-bottom:0}
.stuck-item .badge{flex:none;width:44px;height:44px;border-radius:50%;background:var(--signal);color:#fff;display:grid;place-items:center;font-family:var(--mono);font-size:13.5px;font-weight:700}
.stuck-item .grow{flex:1;min-width:0}
.stuck-item .nm{font-weight:600}
.stuck-item .qt{font-size:13.5px;color:var(--ink-2);background:var(--paper);border-left:3px solid var(--rule-strong);padding:6px 10px;margin-top:5px}
.muted{color:var(--ink-3)}
.empty{text-align:center;padding:34px;color:var(--ink-3);font-style:italic;font-family:var(--serif);font-size:19px}

/* ---------- admin ---------- */
.tabs{display:flex;gap:0;border-bottom:2px solid var(--ink);margin:24px 0 18px;flex-wrap:wrap}
.tabs button{border:1.5px solid var(--rule-strong);border-bottom:0;background:var(--paper-2);padding:9px 18px;margin-right:4px;border-radius:3px 3px 0 0;color:var(--ink-2)}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
table.list{width:100%;border-collapse:collapse;font-size:13.5px}
table.list th{text-align:left;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px;border-bottom:1.5px solid var(--rule-strong)}
table.list td{padding:9px 10px;border-bottom:1px solid var(--rule)}
table.list code{white-space:nowrap}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:760px){.two{grid-template-columns:1fr}}

/* ---------- modal ---------- */
.modal-bg{position:fixed;inset:0;background:rgba(26,24,20,.55);display:grid;place-items:center;z-index:100;padding:20px}
.modal{background:var(--paper);border:2px solid var(--ink);border-radius:3px;max-width:520px;width:100%;padding:24px;max-height:86vh;overflow:auto}
.modal h3{font-family:var(--serif);font-size:26px;margin-bottom:6px}
.modal .actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}
</style>

<body>

<a class="skiplink" href="#app">Перейти к содержимому</a>
<div id="app" tabindex="-1"></div>

<script src="config.js"></script>
<script>
/* =====================================================================
   НАСТРОЙКА — единственное место, где что-то нужно менять руками
   ===================================================================== */

/* =====================================================================
   СПИСОК ПРОЕКТОВ — соответствует инструкции
   ===================================================================== */
const PROJECTS = [
  {n:1, t:'Мигающий светодиод',        s:1, m:10},
  {n:2, t:'Светофор',                  s:1, m:15},
  {n:3, t:'Кнопка и светодиод',        s:1, m:15},
  {n:4, t:'Мелодия на зуммере',        s:1, m:20},
  {n:5, t:'RGB-радуга',                s:1, m:15},
  {n:6, t:'«Hello World» на LCD 1602', s:2, m:40},
  {n:7, t:'Метеостанция DHT11 + LCD',  s:3, m:45},
  {n:8, t:'Умный ночник',              s:2, m:25},
  {n:9, t:'Серво и потенциометр',      s:2, m:25},
  {n:10,t:'Джойстик, серво и RGB',     s:3, m:40},
  {n:11,t:'Кодовый замок',             s:4, m:70},
  {n:12,t:'ИК-пульт управляет LED',    s:2, m:35},
  {n:13,t:'Счётчик 0–9 на индикаторе', s:2, m:35},
  {n:14,t:'Часы 4-разрядные',          s:4, m:70},
  {n:15,t:'Термометр на LM35',         s:2, m:30},
  {n:16,t:'Матрица 8×8 + 74HC595',     s:4, m:80},
  {n:17,t:'Шаговый мотор 28BYJ-48',    s:4, m:50}
];
const NPROJ = PROJECTS.length;

/* Фотографии собранных проектов — лежат в папке инструкции.
   У проекта 16 снимка сборки пока нет, стоит фото самой матрицы. */
const PHOTO = {
  1:'proj1-photo.jpg',  2:'proj2-assembled.jpg', 3:'proj3-assembled.jpg',
  4:'proj4-assembled.jpg', 5:'proj5-photo.jpg',  6:'proj6-photo.jpg',
  7:'proj7-photo.jpg',  8:'proj8-photo.jpg',     9:'proj9-photo.jpg',
  10:'proj10-photo.jpg', 11:'proj11-photo.jpg', 12:'proj12-photo.jpg',
  13:'proj13-photo.jpg', 14:'proj14-photo.jpg', 15:'proj15-photo.jpg',
  16:'comp-31-matrix.jpg', 17:'proj17-photo.jpg'
};

const STATUS = {
  todo:  {label:'Ещё не начинал', short:'·'},
  doing: {label:'Делаю сейчас',   short:'~'},
  stuck: {label:'Застрял',        short:'!'},
  done:  {label:'Собрано ✓',      short:'✓'}
};

/* =====================================================================
   ХРАНИЛИЩЕ
   Два режима. Пока CONFIG.API_URL пустой — всё живёт в браузере
   (демо). Как только адрес вставлен — все запросы уходят в
   Google-таблицу через Apps Script.
   ===================================================================== */
const Store = {
  db: null,
  get live(){ return !!CONFIG.API_URL; },

  // --- запрос к Apps Script через JSONP (обходит ограничения браузера) ---
  api(action, params){
    return new Promise((resolve, reject) => {
      const cb = 'cb_' + Math.random().toString(36).slice(2);
      const q = new URLSearchParams({action, callback: cb, ...params});
      const s = document.createElement('script');
      const timer = setTimeout(() => { cleanup(); reject(new Error('Нет ответа от таблицы')); }, 15000);
      function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
      window[cb] = (data) => { cleanup(); data && data.error ? reject(new Error(data.error)) : resolve(data); };
      s.onerror = () => { cleanup(); reject(new Error('Не удалось связаться с таблицей')); };
      s.src = CONFIG.API_URL + '?' + q.toString();
      document.body.appendChild(s);
    });
  },

  async load(){
    if (this.live) { this.db = await this.api('getAll', {}); return this.db; }
    // Локальный файл, открытый двойным кликом, иногда не получает доступ к хранилищу
    // браузера. Тогда демо просто работает «на один сеанс», а не падает с ошибкой.
    let raw = null;
    try { raw = localStorage.getItem('robo_school_db_v4'); } catch(e){}
    try { this.db = raw ? JSON.parse(raw) : seedDemo(); } catch(e){ this.db = seedDemo(); }
    this.persist();
    return this.db;
  },
  persist(){ if(!this.live){ try{ localStorage.setItem('robo_school_db_v4', JSON.stringify(this.db)); }catch(e){} } },

  async setProgress(studentId, proj, status, note){
    const key = studentId + ':' + proj;
    this.db.progress[key] = {status, note: note||'', updated: new Date().toISOString()};
    if (this.live) await this.api('setProgress', {studentId, proj, status, note: note||''});
    else this.persist();
  },
  prog(studentId, proj){
    return this.db.progress[studentId + ':' + proj] || {status:'todo', note:'', updated:null};
  },

  async addGroup(g){ this.db.groups.push(g); this.live ? await this.api('addGroup', g) : this.persist(); },
  async delGroup(code){
    this.db.groups = this.db.groups.filter(g => g.code !== code);
    this.db.students = this.db.students.filter(s => s.groupCode !== code);
    this.live ? await this.api('delGroup', {code}) : this.persist();
  },
  async addTeacher(t){ this.db.teachers.push(t); this.live ? await this.api('addTeacher', t) : this.persist(); },
  async delTeacher(id){
    this.db.teachers = this.db.teachers.filter(t => t.id !== id);
    this.live ? await this.api('delTeacher', {id}) : this.persist();
  },
  async addStudents(groupCode, names){
    const added = names.map(n => ({id:'s'+Math.random().toString(36).slice(2,9), name:n, groupCode, kit:false}));
    this.db.students.push(...added);
    this.live ? await this.api('addStudents', {groupCode, names: names.join('|')}) : this.persist();
    return added;
  },
  async delStudent(id){
    this.db.students = this.db.students.filter(s => s.id !== id);
    this.live ? await this.api('delStudent', {id}) : this.persist();
  },
  async setKit(id, kit){
    const s = this.db.students.find(x => x.id === id); if(s) s.kit = kit;
    this.live ? await this.api('setKit', {id, kit: kit ? '1':''}) : this.persist();
  },

  // helpers
  group(code){ return this.db.groups.find(g => g.code === code); },
  studentsOf(code){ return this.db.students.filter(s => s.groupCode === code); },
  teacher(id){ return this.db.teachers.find(t => t.id === id); },
  groupsOf(teacherId){ return this.db.groups.filter(g => g.teacherId === teacherId); },
  doneCount(sid){ let c=0; for(const p of PROJECTS) if(this.prog(sid,p.n).status==='done') c++; return c; },

  // Первый несобранный проект — это и есть тот, над которым ученик работает сейчас.
  // Никто ничего не нажимает специально: платформа считает это сама.
  firstOpen(sid){ for(const p of PROJECTS) if(this.prog(sid,p.n).status !== 'done') return p.n; return null; },

  // --- время: сколько дней прошло, когда была последняя активность ---
  daysSince(iso){
    if (!iso) return null;
    return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  },
  lastTouch(sid){
    let last = null;
    for (const p of PROJECTS){
      const r = this.prog(sid, p.n);
      if (r.updated && (!last || r.updated > last)) last = r.updated;
    }
    return last;
  },
  // сколько проектов закрыто за период: от daysFrom дней назад до daysTo
  doneBetween(daysFrom, daysTo){
    let c = 0;
    for (const key in this.db.progress){
      const r = this.db.progress[key];
      if (r.status !== 'done' || !r.updated) continue;
      const d = this.daysSince(r.updated);
      if (d !== null && d >= daysTo && d < daysFrom) c++;
    }
    return c;
  },

  // Состояние карточки: собрано / застрял / делает сейчас / ещё не дошёл
  state(sid, n){
    const st = this.prog(sid, n).status;
    if (st === 'done')  return 'done';
    if (st === 'stuck') return 'stuck';
    return this.firstOpen(sid) === n ? 'doing' : 'todo';
  }
};

   ДЕМО-ДАННЫЕ — чтобы платформу можно было показать «живой»
   ===================================================================== */
function seedDemo(){
  const teachers = [
    {id:'t1', name:'Айгуль Осмоналиева', pin:'1111'},
    {id:'t2', name:'Нурлан Абдырахманов', pin:'2222'}
  ];
  const groups = [
    {code:'ROBO-7A', name:'Робототехника · 7А · вт/чт 16:00', teacherId:'t1'},
    {code:'ROBO-5B', name:'Робототехника · 5Б · сб 11:00',    teacherId:'t1'},
    {code:'ROBO-9V', name:'Робототехника · 9В · пн/ср 18:00', teacherId:'t2'}
  ];
  const namesA = ['Азамат Жумабеков','Алина Ким','Бекзат Турсунов','Дана Сатылганова','Ислам Каримов','Камила Асанова','Максат Орозов','Нурсултан Бакиев','Сабина Токтогулова','Тимур Эргешов'];
  const namesB = ['Айдана Мурзаева','Данияр Сооронбаев','Жанель Абдиева','Кирилл Ким','Малика Юсупова','Санжар Кадыров','Элина Бектурова'];
  const namesC = ['Адилет Мамытов','Виктория Ли','Гулназ Асылбекова','Джамиля Осмонова','Руслан Ниязов','Фарида Абдуллаева','Эмир Джолдошев','Ясмина Курманова'];
  const mk = (names, code) => names.map((n,i) => ({id: code.toLowerCase()+'-'+(i+1), name:n, groupCode:code, kit: true}));
  const students = [...mk(namesA,'ROBO-7A'), ...mk(namesB,'ROBO-5B'), ...mk(namesC,'ROBO-9V')];

  // Что ученик пишет, когда застрял — своя фраза для каждого проекта.
  const stuckNotes = {
    1:'Залил код, а лампочка не мигает. Мигает только маленькая на самой плате.',
    2:'Жёлтый горит, красный и зелёный нет. Провода воткнул как на картинке.',
    3:'Светодиод горит всё время и на кнопку вообще не реагирует.',
    4:'Зуммер пищит одним тоном, мелодии нет.',
    5:'Цвета не плавные, а резко включаются и выключаются.',
    6:'Подсветка горит, а текста нет. Крутил синий винтик — не помогло.',
    7:'На экране квадраты вместо температуры. Библиотеку поставил.',
    8:'Светодиод горит одинаково и днём, и когда закрываю датчик рукой.',
    9:'Серво дёргается и жужжит, но не поворачивается.',
    10:'Джойстик двигает серво в одну сторону, обратно не идёт.',
    11:'Клавиатура не реагирует, в мониторе порта пусто.',
    12:'Нажимаю на пульт — в мониторе порта одни нули.',
    13:'Индикатор показывает восьмёрку и не меняется.',
    14:'Часы показывают 0:00 и дальше не идут.',
    15:'Температура сама по себе скачет от 20 до 80 градусов.',
    16:'Матрица светится вся целиком, картинка не появляется.',
    17:'Мотор гудит, но вал стоит на месте.'
  };

  // Прогресс идёт строго по порядку, без «дырок»: сначала собранные подряд,
  // затем один текущий проект, всё остальное — ещё не начато.
  // 9В (старшие) ушли дальше всех, 5Б набрали недавно и только начали.
  const progress = {};
  const reach   = {'ROBO-7A':[5,9],  'ROBO-5B':[1,4],  'ROBO-9V':[10,17]};
  // сколько дней назад группа начала заниматься — от этого зависит,
  // растянуты её отметки на все шесть недель графика или только на последние
  const opened  = {'ROBO-7A':63, 'ROBO-5B':26, 'ROBO-9V':72};
  const counters = {};
  const ago = (days) => new Date(Date.now() - days * 86400000).toISOString();

  students.forEach(st => {
    const i = counters[st.groupCode] = (counters[st.groupCode] || 0);
    counters[st.groupCode]++;
    const [lo,hi] = reach[st.groupCode];
    const done = lo + (i % (hi - lo + 1));           // сколько проектов собрано подряд

    // Даты разложены по прошедшим неделям, иначе блоки про темп и «не двигаются»
    // показывали бы пустоту: у всех отметок была бы одна дата — сегодняшняя.
    // Отметки ученика растянуты на весь срок жизни группы, а не сжаты к сегодня,
    // иначе график темпа превращается в ровно растущую лесенку — так не бывает.
    const stale   = (i % 7 === 3);                   // этот давно не заходил
    const lastGap = stale ? 15 + (i % 6) : (i % 5);  // дней с последней отметки
    const span    = opened[st.groupCode] - lastGap;  // на сколько дней растянут его путь
    const step    = Math.max(2, Math.round(span / (done + 1)));

    for (let p = 1; p <= done; p++){
      // лёгкий разброс, чтобы отметки не ложились строго по сетке
      const jitter = ((i + p) % 3) - 1;
      progress[st.id+':'+p] = {status:'done', note:'', updated: ago(lastGap + (done - p) * step + jitter)};
    }

    // Каждый четвёртый ученик застрял на следующем проекте и написал об этом.
    // Часть из них — давно, и к ним никто не подошёл: это важный сигнал директору.
    const next = done + 1;
    if (next <= NPROJ && i % 4 === 1){
      const stuckDays = (i % 8 === 1) ? 8 + (i % 5) : 1 + (i % 3);
      const hourShift = 5 + ((i * 7) % 9);   // разные часы, иначе у всех одно время
      progress[st.id+':'+next] = {status:'stuck', note:stuckNotes[next]||'',
        updated: new Date(Date.now() - stuckDays*86400000 - hourShift*3600000).toISOString()};
    }
  });

  return {school:{name:CONFIG.SCHOOL_NAME, adminPin:'0000'}, teachers, groups, students, progress};
}

// <template> нужен, чтобы браузер правильно разбирал строки таблиц (<tr>, <td>)
const $ = (h) => { const t=document.createElement('template'); t.innerHTML=h.trim(); return t.content.firstElementChild; };
const esc = (s) => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Когда ученик написал «не получается». Преподавателю важно не «12 дней назад»,
// а конкретно: сегодня на занятии или ещё на прошлой неделе дома.
const MONTHS_R = ['января','февраля','марта','апреля','мая','июня',
                  'июля','августа','сентября','октября','ноября','декабря'];
const fmtWhen = (iso) => {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  const two = (n) => String(n).padStart(2,'0');
  const time = two(d.getHours()) + ':' + two(d.getMinutes());
  const now = new Date();
  const day   = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diff  = Math.round((today - day) / 86400000);
  if (diff === 0) return 'сегодня, ' + time;
  if (diff === 1) return 'вчера, ' + time;
  const date = d.getDate() + ' ' + MONTHS_R[d.getMonth()];
  return (d.getFullYear() === now.getFullYear() ? date : date + ' ' + d.getFullYear()) + ', ' + time;
};

// В узкой колонке полное название группы («Робототехника · 7А · вт/чт 16:00»)
// переносится на две строки и мешает читать. Берём из него только сам класс.
const gShort = (g) => {
  if (!g) return '—';
  const parts = String(g.name).split('·').map(s => s.trim()).filter(Boolean);
  return parts.length > 1 ? parts[1] : parts[0];
};

// «1 день / 2 дня / 5 дней» — иначе в отчёте будет «5 день»
const plural = (n, one, few, many) => {
  const a = Math.abs(n) % 100, b = a % 10;
  if (a > 10 && a < 20) return many;
  if (b > 1 && b < 5)   return few;
  if (b === 1)          return one;
  return many;
};
const stars = (n) => '★'.repeat(n) + '☆'.repeat(4-n);

    <div class="grow">
      <div style="font-family:var(--serif);font-size:26px;margin-bottom:4px">${pct < 15 ? 'Только начинаем' : pct < 50 ? 'Хорошо идёшь' : pct < 100 ? 'Больше половины позади' : 'Весь курс пройден!'}</div>
      <p class="muted" style="font-size:13.5px">${cur ? 'Следующий по программе — <b style="color:var(--ink)">Проект ' + String(cur.n).padStart(2,'0') + ' · ' + esc(cur.t) + '</b>' : 'Все проекты закрыты. Красиво.'}</p>
      <div class="bar" style="margin-top:12px"><i style="width:${pct}%"></i></div>
    </div>
  </div>`);

  // Ученик возвращается из инструкции — и текущий проект уже здесь, вместе с обеими
  // кнопками. Иначе пришлось бы каждый раз искать свою карточку среди семнадцати.
  if (cur){
    // Фотография текущего проекта — справа в синем блоке, затемнённая
    // и растворяющаяся в фон. Текст слева лежит на плотном синем, поэтому
    // читаемость не страдает.
    hero.appendChild($(`<div class="hero-photo" style="background-image:url('guide/assets/${PHOTO[cur.n]}')"></div>`));

    const acts = $(`<div class="hero-acts"></div>`);
    acts.appendChild($(`<a class="btn" href="${CONFIG.GUIDE_URL}#proj-${cur.n}">Приступить</a>`));
    const hm = $(`<button class="mark"><span class="box"></span>Собрал</button>`);
    hm.onclick = async () => {
      await Store.setProgress(me.id, cur.n, 'done', '');
      S.flash = cur.n;
      const nx = PROJECTS.find(x => x.n === Store.firstOpen(me.id));
      toast(nx ? 'Проект ' + String(cur.n).padStart(2,'0') + ' собран. Дальше — ' + nx.t
               : 'Весь курс пройден!');
      render();
    };
    acts.appendChild(hm);
    hero.querySelector('.grow').appendChild(acts);
  }
  el.appendChild(hero);

  el.appendChild($(`<div class="section-head"><h2>Мои проекты</h2><span class="sub">Отмечай сам · преподаватель это видит</span></div>`));

  const grid = $(`<div class="proj-grid"></div>`);
  PROJECTS.forEach(p => {
    const pr = Store.prog(me.id, p.n);
    const st = Store.state(me.id, p.n);
    const isDone = st === 'done';

    const c = $(`<div class="pcard ${st}" data-proj="${p.n}">
      <div class="pthumb"><img loading="lazy" src="guide/assets/${PHOTO[p.n]}" alt="${esc(p.t)}"></div>
      <div class="num">${String(p.n).padStart(2,'0')} · ${stars(p.s)} · ${p.m} мин</div>
      <h3>${esc(p.t)}</h3>
      ${st==='stuck' ? `<div><span class="chip stuck">Застрял</span></div>` : ''}
      ${st==='doing' ? `<div><span class="chip doing">Следующий</span></div>` : ''}
      ${st==='stuck' && pr.note ? `<div class="note">${esc(pr.note)}</div>` : ''}
    </div>`);

    // Урок открывается нажатием на саму карточку — отдельная кнопка не нужна.
    // Остаётся только «Не получается».
    const acts = $(`<div class="acts"></div>`);
    const help = $(`<button class="btn ghost tiny">${st==='stuck' ? 'Изменить' : 'Не получается'}</button>`);
    help.onclick = (e) => { e.stopPropagation(); askStuck(me.id, p); };
    acts.appendChild(help);
    c.appendChild(acts);

    // Кнопка-переключатель внизу: она же показывает состояние, она же его меняет.
    // Порядок свободный: ученик может начать с любого проекта. Кто-то приходит
    // уже умея, и заставлять его собирать мигающий светодиод ради очереди — значит
    // потерять его на первом занятии.
    const hint = isDone ? 'Нажми, если отметил по ошибке' : 'Нажми, когда проект заработает';
    const mark = $(`<button class="mark ${isDone?'on':''}" title="${hint}">
      <span class="box">${isDone?'✓':''}</span>Собрал
    </button>`);
    mark.onclick = async (e) => {
      e.stopPropagation();
      await Store.setProgress(me.id, p.n, isDone ? 'todo' : 'done', '');
      S.flash = p.n;
      if (!isDone){
        const nx = PROJECTS.find(x => x.n === Store.firstOpen(me.id));
        toast(nx ? 'Проект ' + String(p.n).padStart(2,'0') + ' собран. Дальше — ' + nx.t
                 : 'Проект ' + String(p.n).padStart(2,'0') + ' собран. Весь курс пройден!');
      } else {
        toast('Отметка снята с проекта ' + String(p.n).padStart(2,'0'));
      }
      render();
    };
    c.appendChild(mark);

    // Карточка целиком открывает урок: и мышью, и с клавиатуры (Enter или пробел).
    const openLesson = () => { location.href = CONFIG.GUIDE_URL + '#proj-' + p.n; };
    c.classList.add('clickable');
    c.setAttribute('role', 'link');
    c.setAttribute('tabindex', '0');
    c.setAttribute('aria-label', 'Открыть урок: проект ' + p.n + ', ' + p.t);
    c.onclick = openLesson;
    c.onkeydown = (e) => {
      if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); openLesson(); }
    };

    grid.appendChild(c);
  });
  el.appendChild(grid);
  const w = document.createElement('div'); w.appendChild(el); return w;
}

function askStuck(studentId, p){
  const prev = Store.prog(studentId, p.n).note;
  S.modal = () => {
    const bg = $(`<div class="modal-bg"><div class="modal">
      <h3>Что не получается?</h3>
      <p class="muted" style="font-size:13.5px">Проект ${String(p.n).padStart(2,'0')} · ${esc(p.t)}</p>
      <div class="field" style="margin-top:16px"><label>Опиши своими словами</label>
        <textarea id="nt" rows="4" placeholder="Например: подсветка горит, а текста на экране нет">${esc(prev)}</textarea></div>
      <p class="muted" style="font-size:13.5px">Преподаватель увидит это у себя и подойдёт к тебе на занятии.</p>
      <div class="actions"><button class="btn ghost" id="cancel">Отмена</button><button class="btn primary" id="ok">Отправить</button></div>
    </div></div>`);
    bg.querySelector('#cancel').onclick = () => { S.modal=null; render(); };
    bg.querySelector('#ok').onclick = async () => {
      const note = bg.querySelector('#nt').value.trim();
      S.modal=null; await Store.setProgress(studentId, p.n, 'stuck', note);
      S.flash = p.n;
      toast('Преподаватель увидит это у себя');
      render();
    };
    return bg;
  };
  render();
}

/* --------------------- КАБИНЕТ ПРЕПОДАВАТЕЛЯ --------------------- */
function viewTeacher(){
  const groups = Store.groupsOf(S.teacherId);
  const el = document.createDocumentFragment();

  if (!groups.length){ el.appendChild($(`<div class="card" style="margin-top:34px"><div class="empty">
    <div class="ico">👥</div>
    <div class="t">На вас пока не назначено ни одной группы</div>
    <div class="s">Группы создаёт администратор школы и назначает преподавателя. Как только вашу группу заведут, она появится здесь сама.</div>
  </div></div>`)); const w=document.createElement('div'); w.appendChild(el); return w; }
  if (!groups.some(g => g.code === S.groupCode)) S.groupCode = groups[0].code;

  const sel = $(`<div class="section-head">
    <h2>Группа</h2>
    <select id="gsel" style="border:1.5px solid var(--rule-strong);background:var(--paper);padding:7px 10px;border-radius:2px">
      ${groups.map(g => `<option value="${esc(g.code)}" ${g.code===S.groupCode?'selected':''}>${esc(g.name)} · ${esc(g.code)}</option>`).join('')}
    </select>
    <span class="spacer" style="flex:1"></span>
  </div>`);
  sel.querySelector('#gsel').onchange = e => { S.groupCode = e.target.value; render(); };
  el.appendChild(sel);

  const list = Store.studentsOf(S.groupCode);
  const totalCells = list.length * NPROJ;
  let doneC=0, stuckList=[];
  list.forEach(s => PROJECTS.forEach(p => {
    const pr = Store.prog(s.id, p.n);
    if (pr.status==='done') doneC++;
    if (pr.status==='stuck') stuckList.push({s, p, note:pr.note, at:pr.updated});
  }));
  const avg = list.length ? (list.reduce((a,s)=>a+Store.doneCount(s.id),0)/list.length) : 0;

  /* --- Урок сегодня ----------------------------------------------------
     Материал нужен преподавателю в начале занятия, а не только когда
     кто-то застрял. Проект платформа определяет сама — берёт тот,
     на котором стоит большинство группы. Выпадающий список рядом,
     чтобы открыть любой другой: например, подготовиться к следующему. */
  if (list.length){
    const tally = {};
    list.forEach(s => { const n = Store.firstOpen(s.id); if (n) tally[n] = (tally[n] || 0) + 1; });
    let lessonN = PROJECTS[0].n, lessonCnt = 0;
    Object.keys(tally).forEach(k => { if (tally[k] > lessonCnt){ lessonCnt = tally[k]; lessonN = +k; } });
    const lp = PROJECTS.find(p => p.n === lessonN) || PROJECTS[0];

    const today = $(`<div class="card" style="display:flex;gap:22px;align-items:center;flex-wrap:wrap;margin-bottom:8px;padding:26px 26px">
      <div style="flex:1;min-width:250px">
        <div style="font-size:15px;font-weight:600;color:var(--ink-3);margin-bottom:10px">Урок сегодня</div>
        <div style="font-family:'Instrument Serif',Georgia,serif;font-weight:400;letter-spacing:.01em;font-size:46px;line-height:1.08">${String(lp.n).padStart(2,'0')} · ${esc(lp.t)}</div>
        <div class="muted" style="font-size:19px;margin-top:10px">Это текущий проект у ${lessonCnt} из ${list.length} учеников группы</div>
      </div>
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <select id="lsel" style="border:1.5px solid var(--rule-strong);background:var(--paper);padding:12px 14px;border-radius:4px;max-width:320px;font-size:17px">
          ${PROJECTS.map(p => `<option value="${p.n}" ${p.n===lessonN?'selected':''}>${String(p.n).padStart(2,'0')} · ${esc(p.t)}</option>`).join('')}
        </select>
        <a class="btn primary" id="lopen" target="_blank" href="${CONFIG.GUIDE_URL}#proj-${lessonN}">Открыть урок</a>
      </div>
    </div>`);
    today.querySelector('#lsel').onchange = e => {
      today.querySelector('#lopen').setAttribute('href', CONFIG.GUIDE_URL + '#proj-' + e.target.value);
    };
    el.appendChild(today);
  }

  el.appendChild($(`<div class="stat-row">
    <div class="stat"><div class="l">Учеников</div><div class="v">${list.length}</div></div>
    <div class="stat"><div class="l">Средний прогресс</div><div class="v">${avg.toFixed(1)}<small> / ${NPROJ}</small></div></div>
    <div class="stat"><div class="l">Проектов закрыто</div><div class="v">${doneC}<small> / ${totalCells}</small></div></div>
    <div class="stat" style="${stuckList.length?'border-color:var(--signal);background:var(--signal-tint)':''}"><div class="l">Застряли сейчас</div><div class="v" style="${stuckList.length?'color:var(--signal)':''}">${stuckList.length}</div></div>
  </div>`));

  /* --- кто застрял --- */
  el.appendChild($(`<div class="section-head"><h2>Кому нужна помощь</h2></div>`));
  const sc = $(`<div class="card"></div>`);
  if (!stuckList.length) sc.appendChild($(`<div class="empty ok">
    <div class="ico">✓</div>
    <div class="t">Сейчас никто не застрял</div>
    <div class="s">Вся группа идёт без затыков. Если кто-то упрётся — он нажмёт «Не получается» у себя, и запись появится здесь.</div>
  </div>`));
  stuckList.forEach(({s,p,note,at}) => {
    const when = fmtWhen(at);
    const it = $(`<div class="stuck-item">
      <div class="badge">${String(p.n).padStart(2,'0')}</div>
      <div class="grow">
        <div class="nm-row"><span class="nm">${esc(s.name)}</span>${when ? `<span class="when">${when}</span>` : ''}</div>
        <div class="muted" style="font-size:13.5px">Проект ${String(p.n).padStart(2,'0')} · ${esc(p.t)}</div>
        ${note ? `<div class="qt">«${esc(note)}»</div>` : `<div class="qt muted">Без описания</div>`}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px"></div>
    </div>`);
    const box = it.lastElementChild;
    // Ученик застрял на конкретном проекте — преподавателю нужен именно он,
    // а не начало инструкции: листать оглавление при ученике неудобно.
    const bg = $(`<a class="btn ghost sm" target="_blank" href="${CONFIG.GUIDE_URL}#proj-${p.n}">Урок</a>`);
    // «Проект работает» ставит проект в собранные, «Помог, доделает» только снимает
    // отметку «застрял». Названия должны говорить, что произойдёт: преподаватель
    // выбирает между ними на ходу, стоя у стола ученика.
    const b1 = $(`<button class="btn sm">Проект работает</button>`);
    b1.onclick = async () => {
      await Store.setProgress(s.id, p.n, 'done', '');
      toast(s.name + ' — проект ' + String(p.n).padStart(2,'0') + ' отмечен собранным');
      render();
    };
    const b2 = $(`<button class="btn ghost sm">Помог, доделает</button>`);
    b2.onclick = async () => {
      await Store.setProgress(s.id, p.n, 'doing', '');
      toast(s.name + ' — отметка «застрял» снята, доделывает');
      render();
    };
    box.append(bg, b1, b2);
    sc.appendChild(it);
  });
  el.appendChild(sc);

  /* --- матрица --- */
  el.appendChild($(`<div class="section-head"><h2>Вся группа на одном экране</h2></div>`));
  const wrapx = $(`<div class="scrollx"></div>`);
  const tbl = $(`<table class="mx">
    <thead><tr><th style="text-align:left;padding-left:12px">Ученик</th>${PROJECTS.map(p=>`<th title="${esc(p.t)} — открыть урок"><a class="mxh" target="_blank" href="${CONFIG.GUIDE_URL}#proj-${p.n}">${String(p.n).padStart(2,'0')}</a></th>`).join('')}<th>Итого</th></tr></thead>
    <tbody></tbody></table>`);
  const tb = tbl.querySelector('tbody');
  list.forEach(s => {
    const tr = $(`<tr><th>${esc(s.name)}</th></tr>`);
    PROJECTS.forEach(p => {
      const pr = Store.prog(s.id, p.n);
      const cs = Store.state(s.id, p.n);
      const td = $(`<td class="cell"><i class="s-${cs}" title="${esc(s.name)} · Проект ${p.n} · ${STATUS[cs].label}${pr.note?' — '+esc(pr.note):''}">${STATUS[cs].short}</i></td>`);
      tr.appendChild(td);
    });
    tr.appendChild($(`<td style="text-align:center;font-family:var(--mono);font-size:12px;padding:0 8px">${Store.doneCount(s.id)}</td>`));
    tb.appendChild(tr);
  });
  wrapx.appendChild(tbl);
  el.appendChild(wrapx);
  el.appendChild($(`<div class="legend">
    <span><i style="background:var(--green)"></i> собрано</span>
    <span><i style="background:#F0D98A"></i> делает сейчас</span>
    <span><i style="background:var(--signal)"></i> застрял</span>
    <span><i style="background:var(--paper)"></i> ещё не начинал</span>
    <span class="muted">наведи курсор на клетку — покажет, что именно не получается</span>
    <span class="muted">нажми на номер проекта в шапке — откроется урок по нему</span>
  </div>`));

  const w = document.createElement('div'); w.appendChild(el); return w;
}

/* ---------------------- КАБИНЕТ АДМИНИСТРАТОРА ---------------------- */
function viewAdmin(){
  const el = document.createDocumentFragment();
  const db = Store.db;

  const totalDone = Object.values(db.progress).filter(p => p.status==='done').length;
  const kits = db.students.filter(s => s.kit).length;
  el.appendChild($(`<div class="stat-row" style="margin-top:26px">
    <div class="stat"><div class="l">Групп</div><div class="v">${db.groups.length}</div></div>
    <div class="stat"><div class="l">Учеников</div><div class="v">${db.students.length}</div></div>
    <div class="stat"><div class="l">Преподавателей</div><div class="v">${db.teachers.length}</div></div>
    <div class="stat"><div class="l">Наборы выданы</div><div class="v">${kits}<small> / ${db.students.length}</small></div></div>
    <div class="stat"><div class="l">Проектов собрано</div><div class="v">${totalDone}</div></div>
  </div>`));

  /* --- Темп и доходимость ----------------------------------------------
     «Проектов собрано» — число, которое только растёт и ничего не говорит:
     оно одинаково хорошо выглядит и когда школа идёт, и когда встала.
     Директору нужны два других вопроса: ускоряемся мы или тормозим,
     и сколько детей вообще доходит до конца курса, а не бросает на третьем. */
  const weeks = [];
  for (let i = 5; i >= 0; i--) weeks.push({ i, n: Store.doneBetween(7*(i+1), 7*i) });
  const wMax   = Math.max(1, ...weeks.map(w => w.n));
  const thisW  = weeks[5].n, prevW = weeks[4].n;
  const delta  = thisW - prevW;
  const dTxt   = delta > 0 ? `на ${delta} ${plural(delta,'проект','проекта','проектов')} больше, чем неделей раньше`
               : delta < 0 ? `на ${-delta} ${plural(-delta,'проект','проекта','проектов')} меньше, чем неделей раньше`
               : 'столько же, сколько неделей раньше';

  const half     = Math.ceil(NPROJ / 2);
  const started  = db.students.filter(s => Store.doneCount(s.id) >= 1).length;
  const midway   = db.students.filter(s => Store.doneCount(s.id) >= half).length;
  const finished = db.students.filter(s => Store.doneCount(s.id) >= NPROJ).length;
  const NS = db.students.length;
  const pctOf = (v) => NS ? Math.round(v / NS * 100) : 0;

  el.appendChild($(`<div class="section-head"><h2>Темп и доходимость</h2><span class="sub">За последние шесть недель</span></div>`));
  const twoTop = $(`<div class="two"></div>`);

  twoTop.appendChild($(`<div class="card">
    <div class="stat" style="margin:0 0 6px"><div class="l">Собрано за 7 дней</div><div class="v">${thisW}</div></div>
    <p class="muted" style="font-size:13.5px;margin:0;line-height:1.5">${dTxt}</p>
    <div class="spark">${weeks.map(w => `<div class="col${w.i===0?' now':''}" title="${w.n} ${plural(w.n,'проект','проекта','проектов')}"><i style="height:${Math.round(w.n / wMax * 100)}%"></i></div>`).join('')}</div>
    <div class="spark-x">${weeks.map(w => `<span>${w.i===0?'эта':'−'+w.i}</span>`).join('')}</div>
    <p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Каждый столбик — одна неделя, слева самая давняя, справа текущая. Высота — сколько проектов вся школа закрыла за ту неделю. Ровный ряд значит стабильный ход, проседание справа — что-то мешает прямо сейчас.</p>
  </div>`));

  const funnel = [
    {t:'Начали',            s:'собрали хотя бы один проект',        v:started},
    {t:'Дошли до середины', s:`собрали ${half} и больше из ${NPROJ}`, v:midway},
    {t:'Прошли весь курс',  s:`все ${NPROJ} проектов`,               v:finished}
  ];
  twoTop.appendChild($(`<div class="card">
    <div class="funnel">${funnel.map(f => `
      <div class="fr">
        <div class="fh"><span class="ft">${f.t}</span><span class="fv">${f.v}<small> из ${NS}</small></span></div>
        <div class="bar"><i style="width:${pctOf(f.v)}%"></i></div>
        <div class="fs">${f.s}</div>
      </div>`).join('')}</div>
    <p class="muted" style="font-size:13.5px;margin:16px 0 0;line-height:1.5">Три ступени одной воронки: сколько детей вообще стартовало, сколько добралось до середины и сколько дошло до конца. Обрыв между первой и второй строкой — это те, кто бросил в начале; между второй и третьей — те, кто устал на финише.</p>
  </div>`));
  el.appendChild(twoTop);

  /* --- Кто застревает надолго и кто пропал -----------------------------
     Обычный «застрял» преподаватель разбирает на ближайшем занятии.
     Директору нужны те двое, кого система пропустила: ребёнок, который
     держит один и тот же затык больше недели, и ребёнок, который просто
     перестал что-либо отмечать — в общей статистике он не виден никак. */
  const stuckLong = [];
  db.students.forEach(s => PROJECTS.forEach(pr => {
    const r = Store.prog(s.id, pr.n);
    if (r.status !== 'stuck') return;
    const d = Store.daysSince(r.updated);
    if (d === null || d < 7) return;
    stuckLong.push({s, p:pr, d, note:r.note, g:Store.group(s.groupCode)});
  }));
  stuckLong.sort((a,b) => b.d - a.d);

  const idle = []; let never = 0;
  db.students.forEach(s => {
    const lt = Store.lastTouch(s.id);
    if (!lt){ never++; return; }
    const d = Store.daysSince(lt);
    if (d !== null && d >= 14) idle.push({s, d, g:Store.group(s.groupCode), done:Store.doneCount(s.id)});
  });
  idle.sort((a,b) => b.d - a.d);

  el.appendChild($(`<div class="section-head"><h2>Требуют внимания</h2><span class="sub">${stuckLong.length + idle.length ? stuckLong.length + idle.length + ' ' + plural(stuckLong.length + idle.length,'запись','записи','записей') : 'чисто'}</span></div>`));
  const twoAtt = $(`<div class="two"></div>`);

  const cStuck = $(`<div class="card"><h3 class="cardh">Застряли дольше недели</h3></div>`);
  if (!stuckLong.length) cStuck.appendChild($(`<div class="empty ok">
    <div class="ico">✓</div>
    <div class="t">Таких нет</div>
    <div class="s">Все затыки разбираются в течение недели. Сюда попадает ученик, который нажал «Не получается» и с тех пор так и не сдвинулся.</div>
  </div>`));
  else {
    const t1 = $(`<table class="list"><thead><tr><th>Ученик</th><th>Группа</th><th>Проект</th><th>Ждёт</th></tr></thead><tbody></tbody></table>`);
    const b1 = t1.querySelector('tbody');
    stuckLong.forEach(r => b1.appendChild($(`<tr>
      <td><b>${esc(r.s.name)}</b>${r.note ? `<div class="qn muted" style="font-size:13.5px;margin-top:3px;line-height:1.45;max-width:34ch">«${esc(r.note)}»</div>` : ''}</td>
      <td style="white-space:nowrap">${esc(gShort(r.g))}</td>
      <td>${String(r.p.n).padStart(2,'0')}<span class="pt"> · ${esc(r.p.t)}</span></td>
      <td style="white-space:nowrap"><span class="chip stuck">${r.d} ${plural(r.d,'день','дня','дней')}</span></td>
    </tr>`)));
    const s1 = $(`<div class="tscroll"></div>`); s1.appendChild(t1); cStuck.appendChild(s1);
    cStuck.appendChild($(`<p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Ребёнок сам написал, что не получается, и с того дня ничего не изменилось. Больше недели на одном месте — это уже не «не разобрался», а «его не дождались»: стоит спросить преподавателя, что там произошло.</p>`));
  }
  twoAtt.appendChild(cStuck);

  const cIdle = $(`<div class="card"><h3 class="cardh">Не двигаются две недели</h3></div>`);
  if (!idle.length) cIdle.appendChild($(`<div class="empty ok">
    <div class="ico">✓</div>
    <div class="t">Все на связи</div>
    <div class="s">У каждого ученика есть отметка за последние две недели. Сюда попадёт тот, кто перестал отмечать проекты — обычно это значит, что он перестал ходить.</div>
  </div>`));
  else {
    const t2 = $(`<table class="list"><thead><tr><th>Ученик</th><th>Группа</th><th>Собрано</th><th>Тишина</th></tr></thead><tbody></tbody></table>`);
    const b2 = t2.querySelector('tbody');
    idle.forEach(r => b2.appendChild($(`<tr>
      <td><b>${esc(r.s.name)}</b></td>
      <td style="white-space:nowrap">${esc(gShort(r.g))}</td>
      <td>${r.done} / ${NPROJ}</td>
      <td style="white-space:nowrap"><span class="chip stuck">${r.d} ${plural(r.d,'день','дня','дней')}</span></td>
    </tr>`)));
    const s2 = $(`<div class="tscroll"></div>`); s2.appendChild(t2); cIdle.appendChild(s2);
    cIdle.appendChild($(`<p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Последняя отметка старше двух недель. Такой ученик не застрял — он молча выпал, и ни одна другая цифра на этой странице этого не покажет: его прогресс просто перестал меняться.${never ? ` Ещё ${never} ${plural(never,'ученик','ученика','учеников')} не ${plural(never,'отметил','отметили','отметили')} ни одного проекта — они пока нигде не считаются.` : ''}</p>`));
  }
  twoAtt.appendChild(cIdle);
  el.appendChild(twoAtt);

  /* --- Группы в сравнении ---------------------------------------------
     Преподаватель видит только свою группу, и сравнить её ему не с чем.
     Директору нужно видеть все рядом: одинаковый курс, разный темп —
     это уже повод для разговора с преподавателем, а не с детьми. */
  el.appendChild($(`<div class="section-head"><h2>Группы в сравнении</h2><span class="sub">Один курс · разный темп</span></div>`));
  const cmp = $(`<div class="card"></div>`);
  if (!db.groups.length) cmp.appendChild($(`<div class="empty">Групп пока нет</div>`));
  else {
    const rows = db.groups.map(g => {
      const list = Store.studentsOf(g.code);
      let stuck = 0;
      list.forEach(s => PROJECTS.forEach(p => { if (Store.prog(s.id, p.n).status === 'stuck') stuck++; }));
      const avg  = list.length ? list.reduce((a,s) => a + Store.doneCount(s.id), 0) / list.length : 0;
      const kits = list.filter(s => s.kit).length;
      return {g, list, stuck, avg, kits, t: Store.teacher(g.teacherId)};
    }).sort((a,b) => b.avg - a.avg);

    const tbl = $(`<table class="list"><thead><tr>
      <th>Группа</th><th>Преподаватель</th><th>Учеников</th>
      <th>Средний прогресс</th><th>Застряли</th><th>Наборы</th>
    </tr></thead><tbody></tbody></table>`);
    const tb = tbl.querySelector('tbody');
    rows.forEach((r, i) => {
      const pct = Math.round(r.avg / NPROJ * 100);
      const last = (i === rows.length - 1 && rows.length > 1);
      tb.appendChild($(`<tr>
        <td><b>${esc(r.g.name)}</b><div class="muted" style="font-family:var(--mono);font-size:12px;margin-top:2px">${esc(r.g.code)}</div></td>
        <td>${esc(r.t ? r.t.name : '—')}</td>
        <td>${r.list.length}</td>
        <td style="min-width:220px">
          <div style="display:flex;align-items:center;gap:10px">
            <span style="font-family:var(--mono);font-size:13.5px;white-space:nowrap">${r.avg.toFixed(1)} / ${NPROJ}</span>
            <div class="bar" style="flex:1"><i style="width:${pct}%"></i></div>
          </div>
        </td>
        <td>${r.stuck ? `<span class="chip stuck">${r.stuck}</span>` : `<span class="muted">—</span>`}</td>
        <td>${r.kits} / ${r.list.length}${last ? '' : ''}</td>
      </tr>`));
    });
    cmp.appendChild(tbl);
    cmp.appendChild($(`<p class="muted" style="font-size:13.5px;margin:14px 0 0;line-height:1.5">Группы отсортированы по среднему прогрессу — сверху те, кто идёт быстрее. Нижняя строка отстаёт: курс у всех одинаковый, значит разница в темпе это вопрос к организации занятий, а не к детям.</p>`));
  }
  el.appendChild(cmp);

  /* --- Вся школа по проектам ------------------------------------------
     У преподавателя такая таблица есть по его группе. Директору нужна та же
     картина, но по всем группам сразу: где кто стоит, кто застрял, и как
     группы выглядят рядом друг с другом на одних и тех же столбцах. */
  el.appendChild($(`<div class="section-head"><h2>Все ученики по проектам</h2></div>`));
  const wrapA = $(`<div class="scrollx"></div>`);
  const tblA = $(`<table class="mx">
    <thead><tr><th style="text-align:left;padding-left:12px">Ученик</th>${PROJECTS.map(p=>`<th title="${esc(p.t)} — открыть урок"><a class="mxh" target="_blank" href="${CONFIG.GUIDE_URL}#proj-${p.n}">${String(p.n).padStart(2,'0')}</a></th>`).join('')}<th>Итого</th></tr></thead>
    <tbody></tbody></table>`);
  const tbA = tblA.querySelector('tbody');

  if (!db.groups.length){
    tbA.appendChild($(`<tr><td colspan="${NPROJ+2}" class="empty">Групп пока нет</td></tr>`));
  } else db.groups.forEach(g => {
    const list = Store.studentsOf(g.code);
    const t = Store.teacher(g.teacherId);
    let stuckG = 0;
    list.forEach(s => PROJECTS.forEach(p => { if (Store.prog(s.id,p.n).status==='stuck') stuckG++; }));
    const avgG = list.length ? (list.reduce((a,s)=>a+Store.doneCount(s.id),0)/list.length) : 0;

    tbA.appendChild($(`<tr class="mx-grp"><th colspan="${NPROJ+2}">
      ${esc(g.name)} <span class="s">${esc(t?t.name:'без преподавателя')} · ${list.length} чел. · в среднем ${avgG.toFixed(1)} из ${NPROJ}${stuckG?' · застряли '+stuckG:''}</span>
    </th></tr>`));

    if (!list.length){
      tbA.appendChild($(`<tr><td colspan="${NPROJ+2}" class="muted" style="padding:10px 15px">В группе пока нет учеников</td></tr>`));
      return;
    }
    list.forEach(s => {
      const tr = $(`<tr><th>${esc(s.name)}</th></tr>`);
      PROJECTS.forEach(p => {
        const pr = Store.prog(s.id, p.n);
        const cs = Store.state(s.id, p.n);
        tr.appendChild($(`<td class="cell"><i class="s-${cs}" title="${esc(s.name)} · Проект ${p.n} · ${STATUS[cs].label}${pr.note?' — '+esc(pr.note):''}">${STATUS[cs].short}</i></td>`));
      });
      tr.appendChild($(`<td style="text-align:center;font-family:var(--mono);font-size:12px;padding:0 8px">${Store.doneCount(s.id)}</td>`));
      tbA.appendChild(tr);
    });
  });
  wrapA.appendChild(tblA);
  el.appendChild(wrapA);
  el.appendChild($(`<div class="legend">
    <span><i style="background:var(--green)"></i> собрано</span>
    <span><i style="background:#F0D98A"></i> делает сейчас</span>
    <span><i style="background:var(--signal)"></i> застрял</span>
    <span><i style="background:var(--paper)"></i> ещё не начинал</span>
    <span class="muted">наведи курсор на клетку — покажет, что именно не получается</span>
  </div>`));

  const tabs = $(`<div class="tabs" style="margin-top:30px">
    <button data-t="groups"   class="${S.tab==='groups'?'on':''}">Группы</button>
    <button data-t="students" class="${S.tab==='students'?'on':''}">Ученики и наборы</button>
    <button data-t="teachers" class="${S.tab==='teachers'?'on':''}">Преподаватели</button>
  </div>`);
  tabs.querySelectorAll('button').forEach(b => b.onclick = () => { S.tab=b.dataset.t; render(); });
  el.appendChild(tabs);

  if (S.tab === 'groups')   el.appendChild(adminGroups());
  if (S.tab === 'students') el.appendChild(adminStudents());
  if (S.tab === 'teachers') el.appendChild(adminTeachers());

  const w = document.createElement('div'); w.appendChild(el); return w;
}

function adminGroups(){
  const box = $(`<div class="two"></div>`);
  const left = $(`<div class="card"><table class="list"><thead><tr><th>Название</th><th>Код</th><th>Преподаватель</th><th>Учеников</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb = left.querySelector('tbody');
  if (!Store.db.groups.length) tb.appendChild($(`<tr><td colspan="5" class="empty">Групп пока нет</td></tr>`));
  Store.db.groups.forEach(g => {
    const t = Store.teacher(g.teacherId);
    const tr = $(`<tr>
      <td>${esc(g.name)}</td>
      <td><code style="font-family:var(--mono);background:var(--paper-3);padding:2px 6px;border-radius:2px">${esc(g.code)}</code></td>
      <td>${esc(t?t.name:'—')}</td>
      <td>${Store.studentsOf(g.code).length}</td>
      <td style="text-align:right"></td></tr>`);
    const del = $(`<button class="btn ghost tiny">Удалить</button>`);
    del.onclick = async () => { if(confirmish('Удалить группу «'+g.name+'» вместе с её учениками?')) { await Store.delGroup(g.code); render(); } };
    tr.lastElementChild.appendChild(del);
    tb.appendChild(tr);
  });

  const right = $(`<div class="card">
    <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:12px">Новая группа</h3>
    <div class="field"><label>Название (что видит преподаватель)</label><input id="gn" placeholder="Робототехника · 6А · вт/чт 15:00"></div>
    <div class="field"><label>Код для учеников</label><input id="gcd" placeholder="ROBO-6A"></div>
    <div class="field"><label>Преподаватель</label><select id="gt">${Store.db.teachers.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join('')}</select></div>
    <div class="err" id="ge"></div>
    <button class="btn primary" id="gadd">Создать группу</button>
  </div>`);
  right.querySelector('#gadd').onclick = async () => {
    const name = right.querySelector('#gn').value.trim();
    const code = right.querySelector('#gcd').value.trim().toUpperCase();
    const teacherId = right.querySelector('#gt').value;
    const e = right.querySelector('#ge');
    if (!name || !code){ e.textContent='Заполни название и код.'; return; }
    if (Store.group(code)){ e.textContent='Группа с таким кодом уже есть.'; return; }
    if (!teacherId){ e.textContent='Сначала добавь хотя бы одного преподавателя.'; return; }
    await Store.addGroup({code, name, teacherId}); render();
  };
  box.append(left, right); return box;
}

function adminStudents(){
  const box = $(`<div class="two"></div>`);
  const left = $(`<div class="card"><table class="list"><thead><tr><th>Ученик</th><th>Группа</th><th>Прогресс</th><th>Набор</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb = left.querySelector('tbody');
  if (!Store.db.students.length) tb.appendChild($(`<tr><td colspan="5" class="empty">Учеников пока нет</td></tr>`));
  Store.db.students.forEach(s => {
    const tr = $(`<tr><td>${esc(s.name)}</td><td><code style="font-family:var(--mono);font-size:12px">${esc(s.groupCode)}</code></td>
      <td>${Store.doneCount(s.id)} / ${NPROJ}</td><td></td><td style="text-align:right"></td></tr>`);
    const kb = $(`<button class="btn ${s.kit?'':'ghost'} tiny">${s.kit?'выдан':'нет'}</button>`);
    kb.onclick = async () => { await Store.setKit(s.id, !s.kit); render(); };
    tr.children[3].appendChild(kb);
    const del = $(`<button class="btn ghost tiny">Удалить</button>`);
    del.onclick = async () => { if(confirmish('Удалить ученика «'+s.name+'»?')) { await Store.delStudent(s.id); render(); } };
    tr.lastElementChild.appendChild(del);
    tb.appendChild(tr);
  });

  const right = $(`<div class="card">
    <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:6px">Добавить учеников</h3>
    <p class="muted" style="font-size:13.5px">Вставь список из журнала — по одному имени в строке. Заведутся все сразу.</p>
    <div class="field"><label>Группа</label><select id="sg">${Store.db.groups.map(g=>`<option value="${esc(g.code)}">${esc(g.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Имена</label><textarea id="sn" rows="7" placeholder="Азамат Жумабеков&#10;Алина Ким&#10;Бекзат Турсунов"></textarea></div>
    <div class="err" id="se"></div>
    <button class="btn primary" id="sadd">Добавить</button>
  </div>`);
  right.querySelector('#sadd').onclick = async () => {
    const code = right.querySelector('#sg').value;
    const names = right.querySelector('#sn').value.split('\n').map(x=>x.trim()).filter(Boolean);
    const e = right.querySelector('#se');
    if (!code){ e.textContent='Сначала создай группу.'; return; }
    if (!names.length){ e.textContent='Список пустой.'; return; }
    await Store.addStudents(code, names); render();
  };
  box.append(left, right); return box;
}

function adminTeachers(){
  const box = $(`<div class="two"></div>`);
  const left = $(`<div class="card"><table class="list"><thead><tr><th>Преподаватель</th><th>Код входа</th><th>Групп</th><th></th></tr></thead><tbody></tbody></table></div>`);
  const tb = left.querySelector('tbody');
  if (!Store.db.teachers.length) tb.appendChild($(`<tr><td colspan="4" class="empty">Преподавателей пока нет</td></tr>`));
  Store.db.teachers.forEach(t => {
    const tr = $(`<tr><td>${esc(t.name)}</td>
      <td><code style="font-family:var(--mono);background:var(--paper-3);padding:2px 6px;border-radius:2px">${esc(t.pin)}</code></td>
      <td>${Store.groupsOf(t.id).length}</td><td style="text-align:right"></td></tr>`);
    const del = $(`<button class="btn ghost tiny">Удалить</button>`);
    del.onclick = async () => { if(confirmish('Удалить преподавателя «'+t.name+'»?')) { await Store.delTeacher(t.id); render(); } };
    tr.lastElementChild.appendChild(del);
    tb.appendChild(tr);
  });

  const right = $(`<div class="card">
    <h3 style="font-family:var(--serif);font-size:22px;margin-bottom:12px">Новый преподаватель</h3>
    <div class="field"><label>Имя</label><input id="tn" placeholder="Айгуль Осмоналиева"></div>
    <div class="field"><label>Код входа (4 цифры)</label><input id="tp" inputmode="numeric" placeholder="3333"></div>
    <div class="err" id="te"></div>
    <button class="btn primary" id="tadd">Добавить</button>
  </div>`);
  right.querySelector('#tadd').onclick = async () => {
    const name = right.querySelector('#tn').value.trim();
    const pin = right.querySelector('#tp').value.trim();
    const e = right.querySelector('#te');
    if (!name || !pin){ e.textContent='Заполни имя и код.'; return; }
    if (Store.db.teachers.some(t=>t.pin===pin) || pin===Store.db.school.adminPin){ e.textContent='Такой код уже занят — придумай другой.'; return; }
    await Store.addTeacher({id:'t'+Math.random().toString(36).slice(2,8), name, pin}); render();
  };
  box.append(left, right); return box;
}

/* маленькое подтверждение вместо confirm() */
function confirmish(msg){ return window.confirm(msg); }

(async function(){
  document.getElementById('app').innerHTML = '<div class="login"><p class="muted">Загружаю…</p></div>';
  try { await Store.load(); }
  catch(e){
    document.getElementById('app').innerHTML =
      '<div class="login"><div class="panel"><h1 style="font-size:26px">Не получилось связаться с таблицей</h1>' +
      '<p class="lede">' + esc(e.message) + '</p>' +
      '<p class="muted" style="font-size:13.5px">Проверь адрес в CONFIG.API_URL и что скрипт опубликован с доступом «Все» (см. НАСТРОЙКА.md).</p></div></div>';
    return;
  }
  restore();
  render();
})();

<script>
/* Защита от копирования — как в инструкции. Поля ввода не трогаем:
   преподавателю нужно копировать код группы, ученику — вводить его. */
document.addEventListener('copy', function(e) {
  var t = e.target;
  if (t && t.closest && t.closest('input, textarea, [contenteditable="true"]')) return;
  e.preventDefault();
}, false);
document.addEventListener('contextmenu', function(e) {
  var t = e.target;
  if (t && t.closest && t.closest('input, textarea, [contenteditable="true"]')) return;
  e.preventDefault(); return false;
}, false);
</script>
